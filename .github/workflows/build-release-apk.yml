name: Build Installable APK for Sharing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Web Assets to Public Folder
        run: |
          mkdir -p public
          cp -f *.html public/ 2>/dev/null || true
          cp -f *.png public/ 2>/dev/null || true
          cp -f *.js public/ 2>/dev/null || true
          cp -f manifest*.json public/ 2>/dev/null || true

      - name: Sync Capacitor Android
        run: |
          npm install
          npx cap sync android

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Production keystore secret detected. Decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "No production keystore secret found. Generating debug keystore for sharing..."
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RideSathiGo,OU=RideSathi,O=RideSathi,C=IN"
          fi

      - name: Build Signed Release APK and Backup Debug APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Verify Generated APKs
        run: |
          echo "Release APK directory:"
          ls -la android/app/build/outputs/apk/release/
          echo "Debug APK directory:"
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload Installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Backup Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
